name: RaceDay Project Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  project-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required Part 1 files
        run: |
          test -f README.md
          test -f docs/RaceDay_ERD.drawio.png
          test -f docs/API_Endpoint_Plan.md
          test -f docs/RaceDay_Database.sql

      - name: Verify project structure
        run: |
          echo "RaceDay Part 1 files found successfully."
          echo "Project structure check passed."
